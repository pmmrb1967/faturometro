# Faturómetro sync server (Cloudflare Workers + D1, free plan).
# Setup (once, needs a Cloudflare account):
#   pnpm exec wrangler login
#   pnpm exec wrangler d1 create faturometro --jurisdiction eu   # data stays in the EU; copy database_id below
#   pnpm exec wrangler d1 create faturometro-files --jurisdiction eu   # original files; copy its id too
#   pnpm exec wrangler d1 migrations apply faturometro --remote
#   pnpm exec wrangler d1 migrations apply faturometro-files --remote
#   pnpm exec wrangler secret put PRELOGIN_SECRET    # long random string
#   pnpm exec wrangler secret put ADMIN_EMAILS       # administrator emails, comma-separated (never in this file)
#   pnpm exec wrangler deploy
name = "sync"
main = "src/worker.ts"
# Pin the Cloudflare account: this machine is also logged in to the Wattómetro account.
account_id = "228a5886f6ada239609955a875486421"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "faturometro"
database_id = "154a4e50-74c1-4fb0-92c2-33cf9032b842" # created with --jurisdiction eu
migrations_dir = "migrations"

[[d1_databases]]
# Original files (encrypted chunks), separate so a full file store never blocks record sync.
binding = "FILES"
database_name = "faturometro-files"
database_id = "4217a285-91b2-4b31-ab81-eeebc4ce7dcd" # created with --jurisdiction eu
migrations_dir = "migrations-files"

[vars]
# Origins of the app allowed to call the API (comma-separated).
ALLOWED_ORIGINS = "https://app.faturometro.workers.dev,http://localhost:5173,http://localhost:4173"
# Free plan limits (docs/superpowers/specs/2026-10-14-sync-capacity-design.md).
FILE_QUOTA_MB = "30"
ADMIN_FILE_QUOTA_MB = "100"
KEEP_MONTHS = "12"
RECORD_QUOTA_MB = "5"
MAX_ACCOUNTS = "200"
ADMISSION_PERCENT = "80"
INACTIVE_MONTHS = "12"
# Layout contributions (encrypted for the maintainer): per day and total stored.
# The token to pull them is a secret: wrangler secret put CONTRIB_ADMIN_TOKEN
CONTRIB_DAILY_MAX = "30"
CONTRIB_TOTAL_MB = "20"

# Requests per IP (Workers rate limiting; counted by Cloudflare, nothing stored):
# new accounts and layout contributions. Sign-in already locks an account after 10 failures.
# The period can only be 10 or 60 seconds; namespace_id is any number unique in the account.
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "CONTRIB_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

[triggers]
# Daily maintenance: inactive accounts and usage totals (src/maintenance.ts).
crons = ["17 3 * * *"]
