# Weekly check of the links to COM.escolha, ANACOM's tariff comparator
# (docs/anacom-comescolha.md). Only public pages are read.
# - Parameters changed and still work: commit src/data/comescolha.json and redeploy
#   the app (commits made with GITHUB_TOKEN do not trigger the CI workflow).
# - A filter is ignored or a form changed: open (or comment on) an issue, so
#   GitHub notifies the maintainer by email. The app keeps the last good file.
name: COM.escolha links

on:
  schedule:
    - cron: '23 6 * * 2' # Tuesdays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 228a5886f6ada239609955a875486421
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Check
        id: check
        run: |
          set +e
          pnpm --silent comescolha:check > report.md
          code=$?
          set -e
          cat report.md
          if [ "$code" = "2" ]; then echo "alert=true" >> "$GITHUB_OUTPUT"; elif [ "$code" != "0" ]; then exit "$code"; fi
      - name: Open or update the issue
        if: steps.check.outputs.alert == 'true'
        run: |
          title="Ligações ao COM.escolha deixaram de filtrar"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet src/data/comescolha.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/comescolha.json
          git commit -m "chore(data): update COM.escolha parameters"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy the app with the new parameters
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm deploy:app
