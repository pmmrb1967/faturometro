# Weekly refresh of public/data/erse-offers.json from the ERSE price simulator.
# Only public market data; commits when the ERSE file changed.
name: ERSE offers

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm erse:sync
      - name: Commit if changed
        run: |
          if git diff --quiet public/data/erse-offers.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/erse-offers.json
          git commit -m "chore(data): update ERSE offers"
          git push
