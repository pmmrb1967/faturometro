# The app (static PWA) on Cloudflare: https://app.faturometro.workers.dev
# Deploy: pnpm build && pnpm exec wrangler deploy -c wrangler.app.toml
# The sync server has its own configuration in server/wrangler.toml.
name = "app"
# Pin the Cloudflare account: this machine is also logged in to the Wattómetro account.
account_id = "228a5886f6ada239609955a875486421"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
# Client-side routes (/app/…, /entrar…) are served by index.html.
not_found_handling = "single-page-application"
# Files are served at their own name: /google….html must not redirect to
# /google… (Search Console verification). "/" still reaches index.html.
html_handling = "none"
